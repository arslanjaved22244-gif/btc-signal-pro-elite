name: BTC Signal Pro Elite Monitor

on:
  push:
    paths:
      - "bot/monitor.py"
      - "liquidation_monitor.py"
      - ".github/workflows/btc-monitor.yml"
  # Market-data completion triggers one monitor pass; a second 5-minute schedule
  # would create duplicate publishers competing for the same main-branch lock.
  workflow_dispatch:
  workflow_run:
    workflows:
      - BTC Futures Market Data
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  # All scheduled publishers share one lock because they commit generated JSON to main.
  group: btc-signal-main-publisher
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore monitoring state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: btc-monitor-state-${{ github.run_id }}
          restore-keys: |
            btc-monitor-state-

      - name: Run BTC monitor
        run: python3 bot/monitor.py

      - name: Publish dashboard market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Preserve this run's snapshots while rebasing its commit base onto the newest main.
          git reset --mixed origin/main
          git add market_snapshot.json prediction_performance.json
          if ! git diff --cached --quiet; then
            git commit -m "Update derivatives and news snapshot"
          fi
          git push origin HEAD:main

      - name: Save monitoring state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: btc-monitor-state-${{ github.run_id }}
