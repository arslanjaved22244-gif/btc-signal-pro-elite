name: BTC Signal Pro Elite Monitor

on:
  push:
    paths:
      - "bot/monitor.py"
      - "liquidation_monitor.py"
      - ".github/workflows/btc-monitor.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - BTC Futures Market Data
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: btc-signal-monitor
  cancel-in-progress: true

jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore monitoring state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: btc-monitor-state-${{ github.run_id }}
          restore-keys: |
            btc-monitor-state-

      - name: Run BTC monitor
        run: python3 bot/monitor.py

      - name: Publish dashboard market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_snapshot.json prediction_performance.json
          git diff --cached --quiet || git commit -m "Update derivatives and news snapshot"
          git pull --rebase origin main
          git push

      - name: Save monitoring state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: btc-monitor-state-${{ github.run_id }}
