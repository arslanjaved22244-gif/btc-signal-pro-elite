name: BTC Futures Market Data
on:
  workflow_dispatch:
  push:
    paths:
      - "market_data.py"
      - "news_guard.py"
      - "signal_engine.py"
      - "advanced_modules.py"
      - "liquidation_monitor.py"
      - "telegram_alerts.py"
      - ".github/workflows/market-data.yml"
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: btc-signal-publish
  cancel-in-progress: false
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect public Futures data
        run: python market_data.py
      - name: Scan public news and event risk
        run: python news_guard.py
      - name: Install liquidation WebSocket dependency
        run: python -m pip install websocket-client
      - name: Sample Binance liquidation stream
        run: python liquidation_monitor.py
      - name: Build hybrid AI confluence signal
        run: python signal_engine.py
      - name: Calculate MACD, market structure, backtest and 10x risk
        run: python advanced_modules.py
      - name: Send optional Telegram manual signal alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISK_EQUITY_USDT: ${{ secrets.RISK_EQUITY_USDT }}
          RISK_FRACTION: "0.01"
        run: python telegram_alerts.py
      - name: Publish market and signal snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_data.json event_guard.json event_guard_state.json signal_result.json advanced_metrics.json liquidation_data.json alert_state.json alert_status.json
          git diff --cached --quiet || git commit -m "Refresh Futures data and AI signal"
          git pull --rebase origin main
          git push
