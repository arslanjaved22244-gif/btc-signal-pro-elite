name: BTC Futures Market Data
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: futures-market-data
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect public Futures data
        run: python market_data.py
      - name: Build hybrid AI confluence signal
        run: python signal_engine.py
      - name: Publish market and signal snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_data.json signal_result.json
          git diff --cached --quiet || git commit -m "Refresh Futures data and AI signal"
          git push
