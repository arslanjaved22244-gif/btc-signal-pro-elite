name: BTC Futures Market Data
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - BTC Signal Pro Elite AI
    types: [completed]
    branches: [main]
  push:
    paths:
      - "market_data.py"
      - "paper_trader.py"
      - "exchange_compare.py"
      - "news_guard.py"
      - "signal_engine.py"
      - "ai_result.json"
      - "advanced_modules.py"
      - "liquidation_monitor.py"
      - "telegram_alerts.py"
      - ".github/workflows/market-data.yml"
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  # All scheduled publishers share one lock because they commit generated JSON to main.
  group: btc-signal-main-publisher
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect public Futures data
        run: python market_data.py
      - name: Scan public news and event risk
        run: python news_guard.py
      - name: Install liquidation WebSocket dependency
        run: python -m pip install websocket-client
      - name: Sample Binance liquidation stream
        run: python liquidation_monitor.py
      - name: Compare Binance, Bybit and OKX perpetual prices
        run: python exchange_compare.py
      - name: Build hybrid AI confluence signal
        run: python signal_engine.py
      - name: Run fee-aware paper trading (no orders)
        run: python paper_trader.py
      - name: Calculate MACD, market structure, backtest and 10x risk
        run: python advanced_modules.py
      - name: Publish market and signal snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Keep this run's generated JSON, but base its commit on the newest main.
          # This avoids rebase conflicts when scheduled runs overlap with code deploys.
          git reset --mixed origin/main
          git add market_data.json event_guard.json event_guard_state.json signal_result.json advanced_metrics.json liquidation_data.json alert_state.json alert_status.json exchange_comparison.json paper_trading.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Futures data and AI signal"
          fi
          git push origin HEAD:main
