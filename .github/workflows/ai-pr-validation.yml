name: BTC Signal Pro Elite PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "ai_model.py/**"
      - "signal_engine.py"
      - "paper_trader.py"
      - "tests/**"
      - ".github/workflows/ai-pr-validation.yml"
  push:
    branches:
      - "fix/validation-report-provenance"
    paths:
      - "ai_model.py/**"
      - "signal_engine.py"
      - "paper_trader.py"
      - "tests/**"
      - ".github/workflows/ai-pr-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn xgboost
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile application modules
        run: python -m py_compile ai_model.py/ai_model.py signal_engine.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
