name: BTC Signal Pro Elite AI

on:
  workflow_dispatch:
  push:
    paths:
      - "ai_model.py/**"
      - ".github/workflows/ai-model.yml"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-signal-publish
  cancel-in-progress: true

jobs:
  train-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install advanced ML libraries
        run: python -m pip install --upgrade pip numpy scikit-learn xgboost

      - name: Run BTC AI model
        run: python ai_model.py/ai_model.py

      - name: Save AI result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ai_result.json /tmp/ai_result_candidate.json
          cp prediction_feedback.json /tmp/prediction_feedback_candidate.json
          git checkout -- ai_result.json
          git pull --rebase origin main
          python - <<'PY'
          import json
          from pathlib import Path
          candidate = json.loads(Path("/tmp/ai_result_candidate.json").read_text())
          current_path = Path("ai_result.json")
          current = json.loads(current_path.read_text()) if current_path.exists() else {}
          if candidate.get("generated_at", "") > current.get("generated_at", ""):
              current_path.write_text(json.dumps(candidate, indent=2))
              print("Publishing newer AI result:", candidate.get("generated_at"))
          else:
              print("Keeping newer published AI result:", current.get("generated_at"))

          # Merge the run's feedback with the latest repository ledger after pull.
          candidate_ledger = json.loads(Path("/tmp/prediction_feedback_candidate.json").read_text())
          ledger_path = Path("prediction_feedback.json")
          current_ledger = json.loads(ledger_path.read_text()) if ledger_path.exists() else {"version": 1, "predictions": []}
          merged = {}
          for item in current_ledger.get("predictions", []) + candidate_ledger.get("predictions", []):
              key = item.get("id")
              if not key:
                  continue
              previous = merged.get(key)
              if previous is None or (previous.get("status") != "EVALUATED" and item.get("status") == "EVALUATED"):
                  merged[key] = item
          records = sorted(merged.values(), key=lambda item: int(item.get("prediction_time", 0)))[-1000:]
          ledger_path.write_text(json.dumps({
              "version": 1,
              "last_updated": candidate_ledger.get("last_updated"),
              "scoring_rule": candidate_ledger.get("scoring_rule"),
              "predictions": records
          }, indent=2))
          print("Persisting prediction feedback records:", len(records))
          PY
          git add ai_result.json prediction_feedback.json
          git diff --cached --quiet || git commit -m "Update AI prediction and feedback"
          git push
