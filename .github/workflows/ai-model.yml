name: BTC Signal Pro Elite AI

on:
  workflow_dispatch:
  push:
    paths:
      - "ai_model.py/**"
      - ".github/workflows/ai-model.yml"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-signal-publish
  cancel-in-progress: false

jobs:
  train-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install advanced ML libraries
        run: python -m pip install --upgrade pip numpy scikit-learn xgboost

      - name: Run BTC AI model
        run: python ai_model.py/ai_model.py

      - name: Save AI result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_result.json
          git diff --cached --quiet || git commit -m "Update AI prediction"
          git pull --rebase origin main
          git push
