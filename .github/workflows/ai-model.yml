name: BTC Signal Pro Elite AI

on:
  workflow_dispatch:
  push:
    paths:
      - "ai_model.py/**"
      - "tests/**"
      - "signal_engine.py"
      - "paper_trader.py"
      - ".github/workflows/ai-model.yml"
  # Model training is compute-heavy; it must not hold the live publisher lock.
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  train-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: btc-ai-pip-${{ runner.os }}-py311-v1
          restore-keys: |
            btc-ai-pip-${{ runner.os }}-py311-

      - name: Install advanced ML libraries
        run: |
          python -m pip install --upgrade pip numpy scikit-learn xgboost
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile application modules
        run: python -m py_compile ai_model.py/ai_model.py signal_engine.py

      - name: Test adaptive learning and feedback safety
        run: python -m unittest discover -s tests -v

      - name: Run BTC AI model
        run: python ai_model.py/ai_model.py

      - name: Upload AI candidate outputs
        uses: actions/upload-artifact@v4
        with:
          name: btc-ai-candidate-${{ github.run_id }}
          path: |
            ai_result.json
            prediction_feedback.json
          if-no-files-found: error
          retention-days: 1

  publish-ai:
    needs: train-ai
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only the short git publication phase shares the lock with live publishers.
    concurrency:
      group: btc-signal-main-publisher
      cancel-in-progress: false
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download AI candidate outputs
        uses: actions/download-artifact@v4
        with:
          name: btc-ai-candidate-${{ github.run_id }}
          path: ai-candidate

      - name: Merge and publish AI result safely
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          candidate_dir = Path("ai-candidate")
          candidate_result = json.loads((candidate_dir / "ai_result.json").read_text())
          candidate_ledger = json.loads((candidate_dir / "prediction_feedback.json").read_text())

          result_path = Path("ai_result.json")
          current_result = json.loads(result_path.read_text()) if result_path.exists() else {}
          if candidate_result.get("generated_at", "") > current_result.get("generated_at", ""):
              result_path.write_text(json.dumps(candidate_result, indent=2))
              print("Publishing newer AI result:", candidate_result.get("generated_at"))
          else:
              print("Keeping newer published AI result:", current_result.get("generated_at"))

          ledger_path = Path("prediction_feedback.json")
          current_ledger = json.loads(ledger_path.read_text()) if ledger_path.exists() else {"version": 1, "predictions": []}
          merged = {}
          for item in current_ledger.get("predictions", []) + candidate_ledger.get("predictions", []):
              key = item.get("id")
              if not key:
                  continue
              previous = merged.get(key)
              if previous is None or (previous.get("status") != "EVALUATED" and item.get("status") == "EVALUATED"):
                  merged[key] = item

          records = sorted(merged.values(), key=lambda item: int(item.get("prediction_time", 0)))[-1000:]
          ledger_path.write_text(json.dumps({
              "version": 1,
              "last_updated": candidate_ledger.get("last_updated"),
              "scoring_rule": candidate_ledger.get("scoring_rule"),
              "predictions": records
          }, indent=2))
          print("Persisting prediction feedback records:", len(records))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_result.json prediction_feedback.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AI prediction and feedback"
            git push origin HEAD:main
          else
            echo "No AI output changes to publish."
          fi
