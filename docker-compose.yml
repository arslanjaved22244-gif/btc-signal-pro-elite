services:
  btc-signal-pro:
    build: .
    container_name: btc-signal-pro
    restart: unless-stopped
    ports:
      - "8080:8080"
    init: true
    stop_grace_period: 20s
    # Expose stale market data / disconnected WebSocket as unhealthy for host monitoring.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 240s
